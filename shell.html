<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>左宥之 · 开场白</title>
<style>
html,body{margin:0;padding:0;background:#000;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#boot{max-width:480px;min-height:560px;margin:0 auto;display:flex;align-items:center;justify-content:center;
  background:#000;color:rgba(255,255,255,.72);font-size:14px;text-align:center;padding:24px;box-sizing:border-box}
#boot .spin{width:22px;height:22px;margin:14px auto 0;border:2px solid rgba(255,255,255,.55);border-top-color:transparent;
  border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#boot button{margin-top:14px;padding:8px 16px;border:1px solid rgba(255,255,255,.35);border-radius:0;background:transparent;color:#fff;cursor:pointer;letter-spacing:1px}
#boot .sub{font-size:12px;color:rgba(255,255,255,.4);margin-top:8px;line-height:1.5;word-break:break-all}
</style>
</head>
<body>
<div id="boot">
  <div>
    <div style="font-size:22px;margin-bottom:8px">🎬</div>
    <div id="tt">正在加载开场白管理…</div>
    <div class="sub" id="sub">从远端拉取 UI</div>
    <div class="spin"></div>
  </div>
</div>
<script>
(function () {
  var HTML_URL = 'https://cdn.jsdelivr.net/gh/fchris1219-del/zyz-opener@main/opener.html';
  var FALLBACK_URL = 'https://fchris1219-del.github.io/zyz-opener/opener.html';
  var RETRY = 3;
  var TIMEOUT = 15000;

  function setStatus(t, s) {
    var a = document.getElementById('tt');
    var b = document.getElementById('sub');
    if (a) a.textContent = t;
    if (b) b.textContent = s || '';
  }

  function showErr(msg) {
    var el = document.getElementById('boot');
    if (!el) return;
    el.innerHTML =
      '<div><div style="font-size:22px;margin-bottom:8px">❌</div><div>加载失败</div>' +
      '<div class="sub"></div><button type="button" id="retry">重试</button></div>';
    var sub = el.querySelector('.sub');
    if (sub) sub.textContent = String(msg || '');
    var btn = document.getElementById('retry');
    if (btn) btn.onclick = function () { location.reload(); };
  }

  function withTimeout(p, ms) {
    return new Promise(function (resolve, reject) {
      var to = setTimeout(function () { reject(new Error('超时 ' + ms + 'ms')); }, ms);
      p.then(
        function (v) { clearTimeout(to); resolve(v); },
        function (e) { clearTimeout(to); reject(e); }
      );
    });
  }

  async function fetchOne(url, attempt) {
    setStatus('正在拉取…', '第 ' + attempt + '/' + RETRY + ' 次\n' + url);
    var u = url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + Date.now();
    var res = await withTimeout(
      fetch(u, { cache: 'no-store', mode: 'cors', credentials: 'omit' }),
      TIMEOUT
    );
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var text = await withTimeout(res.text(), TIMEOUT);
    if (!text || text.length < 200) throw new Error('内容过短 ' + (text ? text.length : 0));
    return text;
  }

  async function fetchHtml() {
    var urls = [HTML_URL, FALLBACK_URL];
    var last = null;
    for (var i = 1; i <= RETRY; i++) {
      var url = urls[(i - 1) % urls.length];
      try {
        return await fetchOne(url, i);
      } catch (e) {
        last = e;
        await new Promise(function (r) { setTimeout(r, 700 * i); });
      }
    }
    throw last || new Error('fetch failed');
  }

  function injectAndRender(html) {
    var s = String(html || '');
    setStatus('注入界面…', 'size ' + s.length);
    try {
      document.open();
      document.write(s);
      document.close();
      return;
    } catch (e1) {
      console.warn('[ZYZ opener] document.write 失败', e1);
    }
    try {
      var blob = new Blob([s], { type: 'text/html;charset=utf-8' });
      location.replace(URL.createObjectURL(blob));
      return;
    } catch (e2) {
      console.warn('[ZYZ opener] blob 失败', e2);
    }
    showErr('无法注入页面');
  }

  async function main() {
    try {
      if (!HTML_URL || HTML_URL.indexOf('example.com') >= 0) {
        showErr('未配置 HTML_URL');
        return;
      }
      var html = await fetchHtml();
      injectAndRender(html);
    } catch (e) {
      console.error('[ZYZ opener]', e);
      showErr((e && e.message) ? e.message : String(e));
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main);
  else main();
})();
</script>
</body>
</html>
