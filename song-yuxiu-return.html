<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{margin:0;padding:0;background:transparent}
#song-yuxiu-opening-return{width:min(240px,72vw);margin:18px 0 6px auto;padding:0}
#song-yuxiu-opening-return-button{position:relative;display:block;width:100%;margin:0;padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#song-yuxiu-opening-return-art{display:block;width:100%;height:auto;filter:drop-shadow(0 5px 10px rgba(79,59,54,.09));transform:translateX(0) scale(1);transform-origin:center;transition:transform .24s cubic-bezier(.22,1,.36,1),filter .24s ease,opacity .18s ease}
#song-yuxiu-opening-return-button:hover #song-yuxiu-opening-return-art{transform:translateX(-4px) scale(1.008);filter:drop-shadow(0 8px 13px rgba(79,59,54,.14))}
#song-yuxiu-opening-return-button:focus-visible{outline:2px solid #6f514a;outline-offset:7px}
@media(prefers-reduced-motion:reduce){#song-yuxiu-opening-return-art{transition:none}#song-yuxiu-opening-return-button:hover #song-yuxiu-opening-return-art{transform:none}}
</style>
</head>
<body>
<div id="song-yuxiu-opening-return">
  <button id="song-yuxiu-opening-return-button" type="button" aria-label="返回开场白选择">
    <img id="song-yuxiu-opening-return-art" src="https://cdn.jsdelivr.net/gh/fchris1219-del/zyz-opener@41502fd10681718d0344cf63c601101ee3cb187a/assets/song-yuxiu/song-yuxiu-return-p1.png" alt="" width="424" height="417">
  </button>
</div>
<script>
(function(){
  var button=document.getElementById('song-yuxiu-opening-return-button');
  if(!button||button.dataset.bound==='true')return;
  button.dataset.bound='true';
  button.addEventListener('click',function(){
    try{sessionStorage.setItem('ljb-skip-opening-verification','1');sessionStorage.setItem('song-yuxiu-open-playlist-after-return','1');}catch(_){ }
    if(typeof setChatMessages==='function'){
      setChatMessages([{message_id:0,swipe_id:0}]);
    }
  });
})();
</script>
</body>
</html>
